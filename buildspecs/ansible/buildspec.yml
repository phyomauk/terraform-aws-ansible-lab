version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing Ansible and dependencies..."
      - pip install ansible boto3 botocore
      - ansible-galaxy collection install amazon.aws
    pre_build:
    commands:
      - echo "Current identity"
      - aws sts get-caller-identity
      - echo "Assuming tf-admin role..."
      - CREDS=$(aws sts assume-role --role-arn ${TF_ADMIN_ROLE_ARN} --role-session-name codebuild-ansible-${CODEBUILD_BUILD_NUMBER})
      - export AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.Credentials.AccessKeyId')
      - export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.Credentials.SecretAccessKey')
      - export AWS_SESSION_TOKEN=$(echo $CREDS | jq -r '.Credentials.SessionToken')

      - echo "Running as tf_admin_role"
      - aws sts get-caller-identity
  build:
    commands:
      - echo "Running Ansible playbook..."
      - cd ansible
      - ansible-playbook -i inventory/aws_ec2.yml site.yml
  post_build:
    commands:
      - echo "Playbook execution completed successfully!"