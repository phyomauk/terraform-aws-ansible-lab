---
# tasks file for mysql_db

- name: Install MySQL server packages
  ansible.builtin.apt:
    name:
      - mysql-server
      - mysql-client
    state: present
    update_cache: true

- name: Ensure MySQL configuration directory exists
  ansible.builtin.file:
    path: /etc/mysql/mysql.conf.d
    state: directory
    mode: '0755'

- name: Configure MySQL bind-address and native password plugin support
  ansible.builtin.blockinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    block: |
      bind-address = 0.0.0.0
      mysqlx-bind-address = 0.0.0.0
      mysql_native_password = ON
      innodb_buffer_pool_size = 128M
      max_connections = 50
    marker: "# {mark} ANSIBLE MANAGED BIND CONFIG"
    create: true
  notify: Restart mysql

- name: Ensure MySQL service is enabled and started
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true

- name: Flush handlers to apply MySQL configuration before user creation
  ansible.builtin.meta: flush_handlers

- name: Wait for MySQL port 3306 to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 3306
    timeout: 30

- name: Create admin user for Ansible management
  community.mysql.mysql_user:
    name: "{{ db_admin_user }}"
    password: "{{ db_admin_password }}"
    host: "%"
    priv: "*.*:ALL,GRANT"
    plugin: mysql_native_password
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    column_case_sensitive: false

- name: Create application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create application database user
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "%"
    plugin: mysql_native_password
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    column_case_sensitive: false

- name: Create employees table
  community.mysql.mysql_query:
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS employees (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100),
        position VARCHAR(100),
        salary INT
      );

- name: Insert sample data into employees table
  community.mysql.mysql_query:
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: "{{ db_name }}"
    query: |
      INSERT INTO employees (name, position, salary)
      SELECT * FROM (SELECT 'Alice', 'Engineer', 90000) AS tmp
      WHERE NOT EXISTS (
        SELECT 1 FROM employees WHERE name='Alice'
      );