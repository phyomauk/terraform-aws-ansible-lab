---
# tasks file for webservers
- name: Install Nginx web server
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure application directory exists
  ansible.builtin.file:
    path: /opt
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Copy web application code
  ansible.builtin.copy:
    src: app.py
    dest: /opt/app.py
    owner: www-data
    group: www-data
    mode: '0644'

- name: Configure Systemd service for Flask application
  ansible.builtin.copy:
    dest: /etc/systemd/system/flaskapp.service
    content: |
      [Unit]
      Description=Flask Web Application
      After=network.target

      [Service]
      User=www-data
      Group=www-data
      WorkingDirectory=/opt
      Environment="PYTHONPATH=/opt"
      Environment="FLASK_APP=app.py"
      Environment="DB_HOST={{ hostvars[groups['role_dbservers'][0]]['private_ip_address'] | default('10.10.20.152') }}"
      Environment="DB_USER={{ db_user | default('db_user') }}"
      Environment="DB_PASSWORD={{ db_password | default('Passw0rd') }}"
      Environment="DB_NAME={{ db_name | default('employee_db') }}"
      ExecStart=/usr/bin/python3 -m gunicorn --workers 2 --bind 127.0.0.1:5000 app:app
      Restart=always

      [Install]
      WantedBy=multi-user.target
    mode: '0644'

- name: Ensure Flask systemd service is started and enabled
  ansible.builtin.systemd:
    name: flaskapp
    state: restarted
    enabled: true
    daemon_reload: true

- name: Configure Nginx as a reverse proxy for Flask
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/default
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          location / {
              proxy_pass http://127.0.0.1:5000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
    mode: '0644'

- name: Ensure default site symlink exists
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link

- name: Restart Nginx service
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: true