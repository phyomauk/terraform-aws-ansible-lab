- 
  name: Gather facts from all hosts
  hosts: 
    - role_webservers
    - role_dbservers
  gather_facts: true

-
  name: Deploy a mysql DB
  hosts: role_dbservers
  become: yes
  roles: 
    - python
    - mysql_db

- 
  name: Deploy two web servers
  hosts: role_webservers
  become: yes
  roles: 
    - python
    - webserver


