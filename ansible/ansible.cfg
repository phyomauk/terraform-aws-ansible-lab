[defaults]
inventory = ./inventory/aws_ec2.yml
remote_user = ubuntu
private_key_file = "~/.ssh/my-lab-key.pem"
host_key_checking = False
roles_path = ./roles
deprecation_warnings = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="aws ssm start-session --region us-west-1 --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"