[defaults]
inventory           = ./inventory/aws_ec2.yml
remote_user         = ubuntu
host_key_checking   = False
roles_path          = ./roles

[privilege_escalation]
become              = True
become_method       = sudo
become_user         = root
become_ask_pass     = False

[ssh_connection]
# Optimizes SSH connections and reuses open sockets
pipelining          = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"