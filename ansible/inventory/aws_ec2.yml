plugin: amazon.aws.aws_ec2
regions:
  - us-west-1

keyed_groups:
  - key: tags.Role
    prefix: role
  - key: tags.Environment
    prefix: env  # Optional: keeps consistency if you have environment tags

hostnames:
  -instance-id

compose:
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_aws_ssm_region: "'us-west-1'"